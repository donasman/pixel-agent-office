<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Agent Office</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #181825; color: #cdd6f4; font: 13px "Malgun Gothic", sans-serif; }
  body { display: flex; flex-direction: column; position: relative; }
  #office { flex: 1; min-height: 0; display: block; width: 100%; }
  #roster { margin: 0; padding: 8px 12px; list-style: none; flex: 0 0 22%; box-sizing: border-box; overflow-y: auto; border-top: 1px solid #313244; } /* fixed height so the office doesn't jump as people come and go */
  #roster li { padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #roster .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; outline: 1px solid #6c7086; }
  #roster .st { color: #a6adc8; }
  #card { position: absolute; min-width: 180px; max-width: 280px; padding: 10px 12px; background: #11111b; border: 1px solid #45475a; border-radius: 6px; box-shadow: 0 4px 16px #0008; font-size: 12px; line-height: 1.6; }
  #card[hidden] { display: none; }
  #card strong { display: block; margin-bottom: 4px; font-size: 13px; color: #f9e2af; }
  #card .k { display: inline-block; width: 64px; color: #a6adc8; }
  #card-close { position: absolute; top: 4px; right: 6px; border: 0; background: none; color: #a6adc8; font-size: 16px; cursor: pointer; }
  #card-close:hover, #card-close:focus-visible { color: #cdd6f4; }
  #mute { position: absolute; top: 8px; right: 8px; padding: 2px 6px; border: 1px solid #45475a; border-radius: 4px; background: #11111b; font-size: 14px; cursor: pointer; }
  #mute:hover, #mute:focus-visible { border-color: #a6adc8; }
</style>
</head>
<body>
<canvas id="office" aria-label="에이전트 사무실"></canvas>
<ul id="roster" aria-live="polite"></ul>
<button id="mute" aria-label="알림 소리 끄기" aria-pressed="false" title="알림 소리 켜기/끄기">🔔</button>
<div id="card" role="dialog" aria-label="캐릭터 정보" hidden>
  <button id="card-close" aria-label="닫기">×</button>
  <div id="card-body"></div>
</div>
<script src="office.js"></script>
<script src="app.js"></script>
</body>
</html>
