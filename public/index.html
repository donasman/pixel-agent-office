<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Agent Office</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #181825; color: #cdd6f4; font: 13px "Malgun Gothic", sans-serif; }
  body { display: flex; flex-direction: column; position: relative; }
  #office { flex: 1; min-height: 0; display: block; width: 100%; }
  #panel { flex: 0 0 28%; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid #313244; } /* fixed height so the office doesn't jump as lists change */
  #tabs { display: flex; align-items: center; gap: 4px; padding: 6px 8px 0; }
  #tabs button { padding: 2px 8px; border: 1px solid #45475a; border-radius: 4px; background: #11111b; color: #a6adc8; font: 12px "Malgun Gothic", sans-serif; cursor: pointer; }
  #tabs button[aria-selected="true"] { color: #cdd6f4; border-color: #f9e2af; }
  #tabs button:hover, #tabs button:focus-visible { border-color: #a6adc8; }
  #tabs button[hidden] { display: none; }
  #ctx { margin-left: auto; display: flex; align-items: center; gap: 6px; color: #a6adc8; font-size: 12px; white-space: nowrap; }
  #ctx[hidden] { display: none; }
  #ctx .bar { width: 72px; height: 6px; border-radius: 3px; background: #313244; overflow: hidden; }
  #ctx .fill { height: 100%; }
  #roster { flex: 1; min-height: 0; margin: 0; padding: 6px 12px; list-style: none; overflow-y: auto; }
  #roster .tick { display: inline-block; width: 14px; }
  #roster .task.completed { color: #7f849c; text-decoration: line-through; }
  #roster .task.in_progress { color: #89b4fa; }
  #roster .file code { font: 12px Consolas, monospace; }
  #roster .hint { color: #7f849c; font-size: 12px; white-space: normal; }
  #roster li { padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #roster .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; outline: 1px solid #6c7086; }
  #roster .st { color: #a6adc8; }
  #card { position: absolute; min-width: 180px; max-width: 280px; padding: 10px 12px; background: #11111b; border: 1px solid #45475a; border-radius: 6px; box-shadow: 0 4px 16px #0008; font-size: 12px; line-height: 1.6; }
  #card[hidden] { display: none; }
  #card strong { display: block; margin-bottom: 4px; font-size: 13px; color: #f9e2af; }
  #card .k { display: inline-block; width: 64px; color: #a6adc8; }
  #card-close { position: absolute; top: 4px; right: 6px; border: 0; background: none; color: #a6adc8; font-size: 16px; cursor: pointer; }
  #card-close:hover, #card-close:focus-visible { color: #cdd6f4; }
  #bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid #313244; }
  #floors { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; }
  #bar button { flex: none; padding: 3px 8px; border: 1px solid #45475a; border-radius: 4px; background: #11111b; color: #cdd6f4; font: 13px "Malgun Gothic", sans-serif; cursor: pointer; white-space: nowrap; }
  #bar button:hover, #bar button:focus-visible { border-color: #a6adc8; }
  #floors button { color: #a6adc8; }
  #floors button[aria-selected="true"] { color: #cdd6f4; border-color: #f9e2af; }
  #floors button.closed { opacity: 0.55; }
  #floors .mark { margin-left: 6px; font-weight: 700; }
  #floors .working { color: #a6e3a1; }
  #floors .waiting { color: #f9e2af; }
  #floors .stuck, #roster .late { color: #fab387; }
  #roster li.ask { white-space: normal; padding: 4px 0; }
  #roster .ask .q { color: #f9e2af; font-weight: 700; }
  #roster .ask code { padding: 0 4px; border-radius: 3px; background: #313244; font: 12px Consolas, monospace; word-break: break-all; }
  #roster .ask button { margin-left: 6px; padding: 1px 10px; border: 1px solid #45475a; border-radius: 4px; background: #11111b; color: #cdd6f4; font: 12px "Malgun Gothic", sans-serif; cursor: pointer; }
  #roster .ask button.allow { border-color: #a6e3a1; }
  #roster .ask button.deny { border-color: #f38ba8; }
  #roster .ask button:hover, #roster .ask button:focus-visible { background: #313244; }
  #roster .ask button:disabled { opacity: 0.5; cursor: default; }
  #follow[aria-pressed="false"] { color: #7f849c; }
</style>
</head>
<body>
<div id="bar">
  <div id="floors" role="tablist" aria-label="층 (claude 세션)"></div>
  <button id="follow" aria-pressed="true" title="일이 생긴 층으로 자동 이동">자동 이동</button>
  <button id="notify" title="이 창을 안 보고 있을 때 승인 대기, 작업 완료, 멈춤을 윈도우 알림으로 알려 줘요" hidden>알림 켜기</button>
  <button id="theme" title="사무실 테마 바꾸기">주간</button>
  <button id="mute" aria-label="알림 소리 끄기" aria-pressed="false" title="알림 소리 켜기/끄기">🔔</button>
</div>
<canvas id="office" aria-label="에이전트 사무실"></canvas>
<div id="panel">
  <div id="tabs" role="tablist" aria-label="아래 목록">
    <button role="tab" data-tab="people">직원</button>
    <button role="tab" data-tab="tasks">할 일</button>
    <button role="tab" data-tab="files">파일</button>
    <span id="ctx" hidden></span>
  </div>
  <ul id="roster" aria-live="polite"></ul>
</div>
<div id="card" role="dialog" aria-label="캐릭터 정보" hidden>
  <button id="card-close" aria-label="닫기">×</button>
  <div id="card-body"></div>
</div>
<script src="office.js"></script>
<script src="app.js"></script>
</body>
</html>
