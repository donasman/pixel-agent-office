<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Agent Office</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #181825; color: #cdd6f4; font: 13px "Malgun Gothic", sans-serif; }
  body { display: flex; flex-direction: column; position: relative; }
  #office { flex: 1; min-height: 0; display: block; width: 100%; }
  #panel { flex: 0 0 28%; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid #313244; } /* fixed height so the office doesn't jump as lists change */
  #tabs { display: flex; align-items: center; gap: 4px; padding: 6px 8px 0; }
  #tabs button { padding: 2px 8px; border: 1px solid #45475a; border-radius: 4px; background: #11111b; color: #a6adc8; font: 12px "Malgun Gothic", sans-serif; cursor: pointer; }
  #tabs button[aria-selected="true"] { color: #cdd6f4; border-color: #f9e2af; }
  #tabs button:hover, #tabs button:focus-visible { border-color: #a6adc8; }
  #tabs button[hidden] { display: none; }
  #ctx { margin-left: auto; display: flex; align-items: center; gap: 6px; color: #a6adc8; font-size: 12px; white-space: nowrap; }
  #ctx[hidden] { display: none; }
  #ctx .bar { width: 72px; height: 6px; border-radius: 3px; background: #313244; overflow: hidden; }
  #ctx .fill { height: 100%; }
  #roster { flex: 1; min-height: 0; margin: 0; padding: 6px 12px; list-style: none; overflow-y: auto; }
  #roster .tick { display: inline-block; width: 14px; }
  #roster .task.completed { color: #7f849c; text-decoration: line-through; }
  #roster .task.in_progress { color: #89b4fa; }
  #roster .file code { font: 12px Consolas, monospace; }
  #roster .hint { color: #7f849c; font-size: 12px; white-space: normal; }
  #roster .when { color: #7f849c; font: 12px Consolas, monospace; }
  #roster .who { color: #a6adc8; }
  #roster li.log, #roster li.report { white-space: normal; }
  #roster summary { cursor: pointer; }
  #roster details pre { margin: 4px 0 4px 16px; padding: 6px 8px; max-height: 240px; overflow: auto; background: #11111b; border-radius: 4px; white-space: pre-wrap; word-break: break-word; font: 12px Consolas, "Malgun Gothic", monospace; }
  #roster .copy { margin-left: 16px; padding: 1px 8px; border: 1px solid #45475a; border-radius: 4px; background: #11111b; color: #cdd6f4; font: 12px "Malgun Gothic", sans-serif; cursor: pointer; }
  #usage { display: flex; gap: 8px; color: #a6adc8; font-size: 12px; white-space: nowrap; }
  #usage[hidden] { display: none; }
  #usage .warm { color: #f9e2af; }
  #usage .hot { color: #f38ba8; }
  #roster li { padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #roster .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; outline: 1px solid #6c7086; }
  #roster .st { color: #a6adc8; }
  #roster .off { color: #7f849c; } /* a defined agent with no work right now */
  #card { position: absolute; min-width: 180px; max-width: 280px; padding: 10px 12px; background: #11111b; border: 1px solid #45475a; border-radius: 6px; box-shadow: 0 4px 16px #0008; font-size: 12px; line-height: 1.6; }
  #card[hidden] { display: none; }
  #card strong { display: block; margin-bottom: 4px; font-size: 13px; color: #f9e2af; }
  #card .k { display: inline-block; width: 76px; color: #a6adc8; } /* fits "Last report" */
  #card-close { position: absolute; top: 4px; right: 6px; border: 0; background: none; color: #a6adc8; font-size: 16px; cursor: pointer; }
  #card-close:hover, #card-close:focus-visible { color: #cdd6f4; }
  #looks { position: absolute; padding: 10px; background: #11111b; border: 1px solid #45475a; border-radius: 6px; box-shadow: 0 4px 16px #0008; font-size: 12px; }
  #looks[hidden] { display: none; }
  #looks strong { display: block; margin-bottom: 6px; font-size: 13px; color: #f9e2af; }
  #looks-grid { display: grid; grid-template-columns: repeat(7, 36px); gap: 4px; }
  #looks-grid button { padding: 2px; border: 1px solid #45475a; border-radius: 4px; background: #f3ede1; cursor: pointer; line-height: 0; }
  #looks-grid button[aria-pressed="true"] { border-color: #f9e2af; box-shadow: 0 0 0 1px #f9e2af; }
  #looks-grid button:hover, #looks-grid button:focus-visible { border-color: #cdd6f4; outline: none; }
  #looks-grid canvas { width: 30px; height: 52px; image-rendering: pixelated; }
  #looks-reset { margin-top: 8px; padding: 3px 10px; border: 1px solid #45475a; border-radius: 4px; background: none; color: #a6adc8; font: inherit; cursor: pointer; }
  #looks-reset:hover, #looks-reset:focus-visible { color: #cdd6f4; }
  #bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-bottom: 1px solid #313244; }
  #floors { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; }
  #bar button { flex: none; padding: 3px 8px; border: 1px solid #45475a; border-radius: 4px; background: #11111b; color: #cdd6f4; font: 13px "Malgun Gothic", sans-serif; cursor: pointer; white-space: nowrap; }
  #bar button:hover, #bar button:focus-visible { border-color: #a6adc8; }
  #floors button { color: #a6adc8; }
  #floors button[aria-selected="true"] { color: #cdd6f4; border-color: #f9e2af; }
  #floors button.closed { opacity: 0.55; }
  #floors .mark { margin-left: 6px; font-weight: 700; }
  #floors .working { color: #a6e3a1; }
  #floors .waiting { color: #f9e2af; }
  #floors .stuck, #roster .late { color: #fab387; }
  #roster li.ask { white-space: normal; padding: 4px 0; }
  #roster .ask .q { color: #f9e2af; font-weight: 700; }
  #roster .ask code, #roster .setup code { padding: 0 4px; border-radius: 3px; background: #313244; font: 12px Consolas, monospace; word-break: break-all; }
  #roster .ask button { margin-left: 6px; padding: 1px 10px; border: 1px solid #45475a; border-radius: 4px; background: #11111b; color: #cdd6f4; font: 12px "Malgun Gothic", sans-serif; cursor: pointer; }
  #roster .ask button.allow { border-color: #a6e3a1; }
  #roster .ask button.deny { border-color: #f38ba8; }
  #roster .ask button:hover, #roster .ask button:focus-visible { background: #313244; }
  #roster .ask button:disabled { opacity: 0.5; cursor: default; }
  #follow[aria-pressed="false"] { color: #7f849c; }
</style>
</head>
<body>
<!-- The words here are English; app.js puts Korean in their place when the browser's language is Korean. -->
<div id="bar">
  <div id="floors" role="tablist" aria-label="Floors (claude sessions)"></div>
  <button id="follow" aria-pressed="true" title="Move to the floor where something happens">Follow</button>
  <span id="usage" hidden></span>
  <button id="notify" title="While this window isn't in front, desktop notifications tell you about permission prompts, finished work and stops" hidden>Turn on notifications</button>
  <button id="theme" title="Change the office theme">Day</button>
  <button id="mute" aria-label="Mute sounds" aria-pressed="false" title="Sounds on/off">🔔</button>
</div>
<canvas id="office" aria-label="Agent office"></canvas>
<div id="panel">
  <div id="tabs" role="tablist" aria-label="Lists">
    <button role="tab" data-tab="people">Staff</button>
    <button role="tab" data-tab="tasks">To-do</button>
    <button role="tab" data-tab="files">Files</button>
    <button role="tab" data-tab="reports">Reports</button>
    <button role="tab" data-tab="log">Log</button>
    <span id="ctx" hidden></span>
  </div>
  <ul id="roster" aria-live="polite"></ul>
</div>
<div id="card" role="dialog" aria-label="Character info" hidden>
  <button id="card-close" aria-label="Close">×</button>
  <div id="card-body"></div>
</div>
<div id="looks" role="dialog" hidden>
  <strong id="looks-title"></strong>
  <div id="looks-grid"></div>
  <button id="looks-reset"></button>
</div>
<script src="office.js"></script>
<script src="app.js"></script>
</body>
</html>
