# Records daily GitHub clone counts (clones.csv; GitHub only keeps 14 days) and npm downloads (npm.csv)
# on the `stats` branch.
# Needs secret TRAFFIC_TOKEN: a fine-grained token for this repo with "Administration: Read-only"
# (the built-in GITHUB_TOKEN cannot read traffic).
name: Traffic
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record clones and npm downloads
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail
          # The fetched days overwrite the same dates already recorded (the latest day can be partial).
          merge() { # file header new-rows
            touch "$1"
            { echo "$2"; { grep -v '^date' "$1" | grep -vF -f <(cut -d, -f1 "$3") || true; cat "$3"; } | sort; } > "$RUNNER_TEMP/out.csv"
            mv "$RUNNER_TEMP/out.csv" "$1"
          }
          curl -fsS https://api.npmjs.org/downloads/range/last-month/pixel-agent-office \
            | jq -r '.downloads[] | "\(.day),\(.downloads)"' > "$RUNNER_TEMP/npm.csv"
          # A failed clones fetch (expired token) still records npm, then fails the run below.
          clones_ok=true
          gh api "repos/${{ github.repository }}/traffic/clones" \
            --jq '.clones[] | "\(.timestamp[:10]),\(.count),\(.uniques)"' > "$RUNNER_TEMP/clones.csv" || clones_ok=false
          git fetch -q origin stats && git checkout -qb stats FETCH_HEAD || { git checkout --orphan stats && git rm -rfq .; }
          merge clones.csv "date,count,uniques" "$RUNNER_TEMP/clones.csv"
          merge npm.csv "date,downloads" "$RUNNER_TEMP/npm.csv"
          git add clones.csv npm.csv
          git diff --cached --quiet || {
            git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "stats $(date -u +%F)"
            git push origin stats
          }
          $clones_ok || { echo "::error::Clone traffic fetch failed: is TRAFFIC_TOKEN expired?"; exit 1; }
